version: '3.8'

services:
  diekomiteeapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diekomiteeapp
    ports:
      - "5003:5003"
    volumes:
      - ./instance:/app/instance
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-bitte-aendern-in-produktion}
      - DATABASE_URL=sqlite:////app/instance/wortmeldung.db
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5003
    restart: unless-stopped
